name: Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: true
    steps:
        - name: Check out repository
          uses: actions/checkout@v7
        - name: Set up Bun
          uses: oven-sh/setup-bun@v2
        - name: Install project dependencies
          run: bun install --frozen-lockfile
        - name: Build website stylesheet
          run: bun run build:css
        - name: Install Bot Hosting CLI
          run: npm install -g bot-hosting
        - name: Login to Bot Hosting
          run:  echo ${{secrets.DEPLOY_AUTH_TOKEN}} | bh login
        - name: Link Project
          run: echo 1 | bh link
        - name: Update Startup Command
          run: |
            curl -X PATCH "https://bot-hosting.net/api/v1/deployments/$(awk -F'"' '/deploymentId/ {print $4}' .bothosting/project.json)/startup" \
            -H "Authorization: Bearer ${{secrets.DEPLOY_AUTH_TOKEN}}" \
            -H "Content-Type: application/json" \
            -d '{"startCommand":"${{vars.START_COMMAND}}"}'
        - name: Deploy to Production
          run: bh deploy
        - name: Verify Deployment
          run: |
            sleep 5
            while true; do
                status=$(bh status | awk 'NR==1 {print $4; exit}')
                if [ "$status" = "running" ]; then
                echo "Deployment successful."
                break
                fi
                if [ "$status" = "offline" ]; then
                echo "Deployment failed."
                exit 1
                fi
                echo "Waiting for deployment to complete..."
                sleep 5
            done
        - name: Logout from Bot Hosting
          run: bh logout && bh unlink
